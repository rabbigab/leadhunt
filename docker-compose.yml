services:
  scraper:
    build: .
    container_name: leadhunt-scraper
    restart: always
    env_file: .env
    volumes:
      - ./sessions:/app/sessions       # cookies FB persistants
      - ./logs:/app/logs               # logs rotatifs
      - ./config.yaml:/app/config.yaml # config rechargeable à chaud
    shm_size: '256mb'                  # requis pour Firefox headless
    environment:
      - HEADLESS=true
    # Healthcheck : vérifie que le process tourne
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.path.exists('/app/logs/scraper.log') or exit(1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optionnel : Watchtower pour mise à jour auto quand tu pushe sur main
  watchtower:
    image: containrrr/watchtower
    container_name: leadhunt-watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 leadhunt-scraper  # vérifie toutes les 5 min
    profiles:
      - autoupdate  # activer avec: docker compose --profile autoupdate up -d
